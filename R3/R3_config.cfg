version 15.2
!
no aaa new-model
hostname R3
!
no ip domain lookup
ipv6 unicast-routing
!
ip tcp synwait-time 5
!
interface Loopback0
 ipv6 address 1::100:3/128
 ipv6 enable
!
interface GigabitEthernet1/0
 no ip address
 negotiation auto
 ipv6 address 1:1:3::3/64
 ipv6 enable
 no shutdown
 ipv6 rip ripng enable
!
interface GigabitEthernet2/0
 no ip address
 negotiation auto
 ipv6 address 1:2:3::3/64
 ipv6 enable
 no shutdown
 ipv6 rip ripng enable
!
interface GigabitEthernet3/0
 no ip address
 negotiation auto
 ipv6 address 1:3:4::3/64
 ipv6 enable
 no shutdown
 ipv6 rip ripng enable
!
router bgp 1
 bgp router-id 3.3.3.3
 no bgp default ipv4-unicast
 neighbor ibgp peer-group
 neighbor ibgp remote-as 1
 neighbor ibgp update-source Loopback0
 neighbor ibpg advertisement-interval 1
 neighbor 1::100:1 peer-group ibgp
 neighbor 1::100:2 peer-group ibgp
 neighbor 1::100:4 peer-group ibgp
 !
 address-family ipv6
  redistribute connected route-map LOCAL_AS
  neighbor 1::100:1 activate
  neighbor 1::100:2 activate
  neighbor 1::100:4 activate
 exit-address-family
!
ipv6 router rip ripng
 redistribute connected
!
ipv6 prefix-list LOCAL_AS seq 1 permit 1::/16 le 128
!
ipv6 prefix-list PEEROVIDERS_PREFIX seq 2 permit 2::/16 le 128
!
route-map LOCAL_AS permit 4
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 1 additive
!
route-map OUT permit 5
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 2 additive
!
route-map OUT permit 6
 match ipv6 address prefix-list CLIENTS_PREFIX
 set community 2 additive
!
route-map ALL permit 1
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 3 additive
!
route-map ALL permit 2
 match ipv6 address prefix-list CLIENTS_PREFIX
 set community 3 additive
!
route-map ALL permit 3
 match ipv6 address prefix-list PEEROVIDERS_PREFIX
 set community 3 additive
!
end