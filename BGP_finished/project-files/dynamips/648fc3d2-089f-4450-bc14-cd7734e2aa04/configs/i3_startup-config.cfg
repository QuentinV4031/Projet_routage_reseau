!
!
!
!
!
!
!
!
!
!
!
!
!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ipv6 unicast-routing
ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no ip address
 ipv6 address 1::100:3/128
 ipv6 enable
!
interface FastEthernet0/0
 no ip address
 ipv6 address fc00:3:5::3/64
 ipv6 enable
!
interface GigabitEthernet1/0
 no ip address
 negotiation auto
 ipv6 address fc00:3:4::3/64
 ipv6 enable
!
interface GigabitEthernet2/0
 no ip address
 negotiation auto
 ipv6 address 1:2:3::3/64
 ipv6 enable
 ipv6 rip ripng enable
!
!
router bgp 1
 bgp router-id 3.3.3.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor ibgp peer-group
 neighbor ibgp remote-as 1
 neighbor ibgp update-source Loopback0
 neighbor 1::100:1 peer-group ibgp
 neighbor 1::100:2 peer-group ibgp
 neighbor fc00:3:4::4 remote-as 3
 neighbor fc00:3:5::5 remote-as 4
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
  redistribute connected route-map LOCAL_AS
  neighbor 1::100:1 activate
  neighbor 1::100:2 activate
  neighbor fc00:3:4::4 activate
  neighbor fc00:3:5::5 activate
  neighbor fc00:3:4::4 route-map OUT out
  neighbor fc00:3:5::5 route-map OUT out
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 router rip ripng
 redistribute connected
!
!
ipv6 prefix-list CLIENTS_PREFIX seq 5 permit 2::/16 ge 17
!
ipv6 prefix-list LOCAL_PREFIX seq 1 permit 1::/16 ge 17
!
ipv6 prefix-list PROVIDERS_PREFIX seq 6 permit 3::/16 ge 17
ipv6 prefix-list PROVIDERS_PREFIX seq 7 permit 4::/16 ge 17
!
route-map OUT permit 1
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 1 additive
!
route-map OUT permit 2
 match ipv6 address prefix-list CLIENTS_PREFIX
 set community 1 additive
!
route-map TAG_PROVIDERS permit 7
 match ipv6 address prefix-list PROVIDERS_PREFIX
 set community 3
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end

