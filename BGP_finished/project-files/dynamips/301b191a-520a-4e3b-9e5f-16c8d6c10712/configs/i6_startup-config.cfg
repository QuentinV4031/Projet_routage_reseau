!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R6
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ipv6 unicast-routing
ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no ip address
 ipv6 address 2::100:6/128
 ipv6 enable
!
interface FastEthernet0/0
 no ip address
 ipv6 address fc00:1:6::6/64
 ipv6 enable
!
!
!
router bgp 2
 bgp router-id 6.6.6.6
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor ibgp peer-group
 neighbor ibgp remote-as 2
 neighbor ibgp update-source Loopback0
 neighbor fc00:1:6::1 remote-as 1
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
  redistribute connected route-map LOCAL_AS
  neighbor fc00:1:6::1 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 router rip ripng
 redistribute connected
!
!
ipv6 prefix-list CLIENTS_PREFIX seq 5 permit 7::/16 ge 17
!
ipv6 prefix-list LOCAL_PREFIX seq 1 permit 2::/16 ge 17
!
ipv6 prefix-list PROVIDERS_PREFIX seq 6 permit 1::/16 ge 17
!
route-map LOCAL_AS permit 5
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 1 additive
!
route-map TAG_CLIENTS permit 10
 match ipv6 address prefix-list CLIENTS_PREFIX
 set community 2
!
route-map TAG_PROVIDERS permit 7
 match ipv6 address prefix-list PROVIDERS_PREFIX
 set community 3
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end