version 15.2
!
no aaa new-model
hostname R8
!
no ip domain lookup
ipv6 unicast-routing
!
ip tcp synwait-time 5
!
interface Loopback0
 ipv6 address 2::100:8/128
 ipv6 enable
!
interface FastEthernet0/0
 no ip address
 negotiation auto
 ipv6 address fc00:1:8::8/64
 ipv6 enable
 no shutdown
!
interface GigabitEthernet1/0
 no ip address
 negotiation auto
 ipv6 address 2:8:10::8/64
 ipv6 enable
 no shutdown
 ipv6 ospf 100 area 0
!
router bgp 2
 bgp router-id 8.8.8.8
 no bgp default ipv4-unicast
 neighbor ibgp peer-group
 neighbor ibgp remote-as 2
 neighbor ibgp update-source Loopback0
 neighbor ibpg advertisement-interval 1
 neighbor 2::100:9 peer-group ibgp
 neighbor 2::100:10 peer-group ibgp
 neighbor 2::100:11 peer-group ibgp
 neighbor fc00:1:8::1 remote-as 1
 !
 address-family ipv6
  redistribute connected route-map LOCAL_AS
  neighbor 2::100:9 activate
  neighbor 2::100:10 activate
  neighbor 2::100:11 activate
  neighbor fc00:1:8::1 activate
  neighbor fc00:1:8::1 route-map OUT out
 exit-address-family
!
ipv6 router ospf 100
 router-id 80.80.80.80
 redistribute connected
!
ipv6 prefix-list LOCAL_AS seq 1 permit 2::/16 le 128
!
ipv6 prefix-list PEEROVIDERS_PREFIX seq 2 permit 1::/16 le 128
!
route-map LOCAL_AS permit 4
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 1 additive
!
route-map OUT permit 5
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 2 additive
!
route-map OUT permit 6
 match ipv6 address prefix-list CLIENTS_PREFIX
 set community 2 additive
!
route-map ALL permit 1
 match ipv6 address prefix-list LOCAL_PREFIX
 set community 3 additive
!
route-map ALL permit 2
 match ipv6 address prefix-list CLIENTS_PREFIX
 set community 3 additive
!
route-map ALL permit 3
 match ipv6 address prefix-list PEEROVIDERS_PREFIX
 set community 3 additive
!
end